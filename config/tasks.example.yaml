# Optional. Required when multiple devices are connected.
device:

safety:
  # Added to built-in risky keywords such as 支付, 下单, 购买, 充值, 授权.
  extra_block_keywords:
    - 拼团
    - 砍价

tasks:
  - name: 支付宝会员签到
    app: com.eg.android.AlipayGphone
    enabled: true
    schedule: "08:30"
    steps:
      - action: click_text
        text: 我的
        timeout: 5
      - action: click_text_any
        texts: ["支付宝会员", "会员"]
        timeout: 4
      - action: click_text_any
        texts: ["签到", "领积分", "立即领取", "领取"]
        timeout: 4
      - action: screenshot
        name: alipay_done

  - name: 淘宝奖励签到
    app: com.taobao.taobao
    enabled: true
    schedule: "08:35"
    steps:
      - action: click_text_any
        texts: ["我的淘宝", "我的"]
        timeout: 5
      - action: click_text_any
        texts: ["签到", "领淘金币", "淘金币", "领金币"]
        timeout: 5
      - action: click_text_any
        texts: ["签到", "立即领取", "领取奖励", "领金币"]
        timeout: 5
      - action: screenshot
        name: taobao_done

  - name: 抢购辅助模板
    app: com.example.app
    enabled: false
    schedule: "09:59"
    steps:
      - action: click_text_any
        texts: ["活动", "秒杀", "抢购"]
        timeout: 5
      - action: wait
        seconds: 10
      - action: click_text_any
        texts: ["立即抢", "马上抢", "开抢"]
        timeout: 2
      - action: screenshot
        name: rush_attempt

